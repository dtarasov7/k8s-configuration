---
- name: Manage cluster access
  hosts: access_executor
  gather_facts: false
  vars:
    k8s_configuration_config_mode: dry
    k8s_configuration_config_platform: vanilla
    k8s_configuration_config_connection_kubeconfig: /etc/ansible/kubeconfigs/cluster.yaml
    k8s_configuration_config_connection_context: cluster
    k8s_configuration_config_management_owner: platform
    k8s_configuration_config_management_namespaces:
    - development
    k8s_configuration_config_management_include_cluster_scoped: false
    k8s_configuration_grants:
    - id: developers
      backend: rbac
      subjects:
      - kind: Group
        source: external
        name: developers
      roleRef:
        kind: ClusterRole
        name: edit
      scope:
        namespaces:
        - development
  roles:
  - role: k8s-configuration
