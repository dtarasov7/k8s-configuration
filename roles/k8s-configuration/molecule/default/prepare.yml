---
- name: Prepare isolated kind fixture
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Prepare namespace through kubectl on the control node
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tests/live_smoke.py"
          - setup
          - "{{ lookup('env', 'KAM_TEST_KUBECONFIG') }}"
      changed_when: false
