---
# Provide -i inventory, -e k8s_configuration_test_host=one-literal-executor
# and -e @private-deckhouse-test-vars.yml.
# Test vars must point to a disposable Deckhouse cluster and include its profile.
- name: Verify configured Deckhouse test profile
  hosts: "{{ k8s_configuration_test_host }}"
  gather_facts: false
  pre_tasks:
    - name: Require explicit test configuration
      ansible.builtin.assert:
        that:
          - k8s_configuration_config_platform == 'deckhouse'
          - k8s_configuration_config_mode == 'apply'
  roles:
    - role: k8s-configuration
  tasks:
    - name: Require idempotence against real controllers
      ansible.builtin.include_role:
        name: k8s-configuration
    - name: Verify no remaining changes
      ansible.builtin.assert:
        that:
          - not k8s_configuration_result.changed
