---
- name: execute.yml - Execute the selected access management mode
  k8s_configuration:
    config_schema_version: "{{ k8s_configuration_config_schema_version }}"
    config_mode: "{{ k8s_configuration_config_mode }}"
    config_platform: "{{ k8s_configuration_config_platform }}"
    config_connection_kubectl: "{{ k8s_configuration_config_connection_kubectl }}"
    config_connection_validate_tls: "{{ k8s_configuration_config_connection_validate_tls }}"
    config_connection_timeout_seconds: "{{ k8s_configuration_config_connection_timeout_seconds }}"
    config_connection_retries: "{{ k8s_configuration_config_connection_retries }}"
    config_connection_kubeconfig: "{{ k8s_configuration_config_connection_kubeconfig }}"
    config_connection_context: "{{ k8s_configuration_config_connection_context }}"
    config_connection_ca_content: "{{ k8s_configuration_config_connection_ca_content }}"
    config_connection_cert_content: "{{ k8s_configuration_config_connection_cert_content }}"
    config_connection_key_content: "{{ k8s_configuration_config_connection_key_content }}"
    config_deckhouse_basic_authz: "{{ k8s_configuration_config_deckhouse_basic_authz }}"
    config_deckhouse_api_versions_authorization_rule: "{{ k8s_configuration_config_deckhouse_api_versions_authorization_rule }}"
    config_deckhouse_api_versions_cluster_authorization_rule: "{{ k8s_configuration_config_deckhouse_api_versions_cluster_authorization_rule }}"
    config_deckhouse_ready_checks_user_authz: "{{ k8s_configuration_config_deckhouse_ready_checks_user_authz }}"
    config_deckhouse_authz_ready_condition: "{{ k8s_configuration_config_deckhouse_authz_ready_condition }}"
    config_deckhouse_mixed_backends: "{{ k8s_configuration_config_deckhouse_mixed_backends }}"
    config_deckhouse_granular_roles: "{{ k8s_configuration_config_deckhouse_granular_roles }}"
    config_deckhouse_controller_markers_labels: "{{ k8s_configuration_config_deckhouse_controller_markers_labels }}"
    config_deckhouse_controller_markers_annotations: "{{ k8s_configuration_config_deckhouse_controller_markers_annotations }}"
    config_deckhouse_controller_markers_name_prefixes: "{{ k8s_configuration_config_deckhouse_controller_markers_name_prefixes }}"
    config_management_owner: "{{ k8s_configuration_config_management_owner }}"
    config_management_prune: "{{ k8s_configuration_config_management_prune }}"
    config_management_adoption: "{{ k8s_configuration_config_management_adoption }}"
    config_management_label_domain: "{{ k8s_configuration_config_management_label_domain }}"
    config_management_namespaces: "{{ k8s_configuration_config_management_namespaces }}"
    config_management_include_cluster_scoped: "{{ k8s_configuration_config_management_include_cluster_scoped }}"
    config_safety_max_deletions: "{{ k8s_configuration_config_safety_max_deletions }}"
    config_safety_allow_empty_desired: "{{ k8s_configuration_config_safety_allow_empty_desired }}"
    config_safety_allow_binding_replacement: "{{ k8s_configuration_config_safety_allow_binding_replacement }}"
    config_safety_protected_namespaces: "{{ k8s_configuration_config_safety_protected_namespaces }}"
    config_safety_protected_namespace_prefixes: "{{ k8s_configuration_config_safety_protected_namespace_prefixes }}"
    config_safety_allowed_protected_namespaces: "{{ k8s_configuration_config_safety_allowed_protected_namespaces }}"
    config_safety_protected_objects: "{{ k8s_configuration_config_safety_protected_objects }}"
    config_server_validation: "{{ k8s_configuration_config_server_validation }}"
    config_wait_timeout_seconds: "{{ k8s_configuration_config_wait_timeout_seconds }}"
    config_expected_plan_digest: "{{ k8s_configuration_config_expected_plan_digest }}"
    export_mode: "{{ k8s_configuration_export_mode }}"
    export_backends: "{{ k8s_configuration_export_backends }}"
    export_cluster_roles: "{{ k8s_configuration_export_cluster_roles }}"
    export_roles: "{{ k8s_configuration_export_roles }}"
    export_access_levels: "{{ k8s_configuration_export_access_levels }}"
    export_namespaces: "{{ k8s_configuration_export_namespaces }}"
    export_include_cluster_scoped: "{{ k8s_configuration_export_include_cluster_scoped }}"
    export_exclude_controller_generated: "{{ k8s_configuration_export_exclude_controller_generated }}"
    export_allow_partial: "{{ k8s_configuration_export_allow_partial }}"
    export_destination: "{{ k8s_configuration_export_destination }}"
    export_audit_destination: "{{ k8s_configuration_export_audit_destination }}"
    matrix_source: "{{ k8s_configuration_matrix_source }}"
    matrix_output_dir: "{{ k8s_configuration_matrix_output_dir }}"
    matrix_scope: "{{ k8s_configuration_matrix_scope }}"
    matrix_namespace_mode: "{{ k8s_configuration_matrix_namespace_mode }}"
    matrix_system_namespaces: "{{ k8s_configuration_matrix_system_namespaces }}"
    matrix_namespace_include: "{{ k8s_configuration_matrix_namespace_include }}"
    matrix_namespace_exclude: "{{ k8s_configuration_matrix_namespace_exclude }}"
    matrix_include_system_subjects: "{{ k8s_configuration_matrix_include_system_subjects }}"
    matrix_include_external_users: "{{ k8s_configuration_matrix_include_external_users }}"
    matrix_system_subjects: "{{ k8s_configuration_matrix_system_subjects }}"
    matrix_users_include: "{{ k8s_configuration_matrix_users_include }}"
    matrix_users_exclude: "{{ k8s_configuration_matrix_users_exclude }}"
    matrix_groups_include: "{{ k8s_configuration_matrix_groups_include }}"
    matrix_groups_exclude: "{{ k8s_configuration_matrix_groups_exclude }}"
    matrix_service_accounts_include: "{{ k8s_configuration_matrix_service_accounts_include }}"
    matrix_service_accounts_exclude: "{{ k8s_configuration_matrix_service_accounts_exclude }}"
    matrix_service_account_namespaces_include: "{{ k8s_configuration_matrix_service_account_namespaces_include }}"
    matrix_service_account_namespaces_exclude: "{{ k8s_configuration_matrix_service_account_namespaces_exclude }}"
    matrix_omit_empty_rows: "{{ k8s_configuration_matrix_omit_empty_rows }}"
    matrix_exclude_broad_subjects: "{{ k8s_configuration_matrix_exclude_broad_subjects }}"
    matrix_namespaces: "{{ k8s_configuration_matrix_namespaces }}"
    matrix_include_cluster_scoped: "{{ k8s_configuration_matrix_include_cluster_scoped }}"
    matrix_subjects_users: "{{ k8s_configuration_matrix_subjects_users }}"
    matrix_subjects_groups: "{{ k8s_configuration_matrix_subjects_groups }}"
    matrix_subjects_service_accounts: "{{ k8s_configuration_matrix_subjects_service_accounts }}"
    matrix_resolve_group_membership: "{{ k8s_configuration_matrix_resolve_group_membership }}"
    matrix_memberships: "{{ k8s_configuration_matrix_memberships }}"
    matrix_csv_delimiter: "{{ k8s_configuration_matrix_csv_delimiter }}"
    certificates: "{{ k8s_configuration_certificates }}"
    # EN: Variable lookup runs only inside the selected branch; Jinja eagerly resolves direct names.
    # RU: Lookup переменной выполняется только в выбранной ветке; прямые имена Jinja раскрывает заранее.
    grants: >-
      {{ lookup('ansible.builtin.vars', 'k8s_configuration_grants', default=omit)
         if k8s_configuration_config_mode in ['apply', 'dry'] or
            (k8s_configuration_config_mode == 'matrix' and k8s_configuration_matrix_source == 'inventory')
         else omit }}
  register: k8s_configuration_result
  no_log: >-
    {{ k8s_configuration_config_mode == 'export' or
       (k8s_configuration_no_log and
        (k8s_configuration_config_mode == 'matrix' or not ansible_diff_mode)) }}
