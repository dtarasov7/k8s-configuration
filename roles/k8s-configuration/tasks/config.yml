---
- name: config.yml - Reconcile access with sanitized failure reporting
  block:
    - name: config.yml - Execute the selected mode
      ansible.builtin.include_tasks:
        file: execute.yml
        apply:
          tags: [config]
  rescue:
    - name: config.yml - Report the sanitized module failure
      ansible.builtin.fail:
        msg: "{{ k8s_configuration_result.msg | default('Access reconciliation failed; review the configuration and API connectivity') }}"

- name: config.yml - Display planned additions, changes and removals
  ansible.builtin.debug:
    msg:
      "Планируем добавить": "{{ k8s_configuration_result.plan.planned.add }}"
      "Планируем изменить": "{{ k8s_configuration_result.plan.planned.change }}"
      "Планируем удалить": "{{ k8s_configuration_result.plan.planned.remove }}"
  when: k8s_configuration_result.plan is defined

- name: config.yml - Display sanitized export summary
  ansible.builtin.debug:
    msg:
      grants: "{{ k8s_configuration_result.exported.inventory.k8s_configuration_grants | length }}"
      warnings: "{{ k8s_configuration_result.exported.warnings }}"
  when: k8s_configuration_result.exported is defined

- name: config.yml - Display access matrix summary
  ansible.builtin.include_tasks:
    file: matrix.yml
    apply:
      tags: [config]
  when: k8s_configuration_result.matrix is defined

- name: config.yml - Save read-only results on Ansible controller
  ansible.builtin.include_tasks:
    file: output.yml
    apply:
      tags: [config]
  when: k8s_configuration_config_mode in ['dry', 'plan', 'export', 'matrix']
