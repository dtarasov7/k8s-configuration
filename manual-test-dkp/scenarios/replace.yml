    - dkp-access-stage
  target_name: dkp-access-temporary
k8s_configuration_grants: '{{ (manual_dkp_grants_baseline | rejectattr(''id'',''equalto'',''temporary-reader'')
  | list) + [manual_dkp_replaced_grant] }}'
